name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      # The engine's purity (spec §1.3) and the rule that the LLM never computes
      # a statement value (§1.1) are claims about what code can reach what.
      # "We'll be careful" is not an enforcement mechanism.
      - name: Package boundaries
        run: pnpm boundaries
      - name: Tests
        run: pnpm test

  # §13.1 asks for 1,000 randomized parameter sets per archetype over 40
  # quarters. That is ~35s today and grows with each archetype, so it runs on a
  # schedule rather than blocking every PR — the PR-gated suite uses a smaller
  # sample of the same property.
  property-suite:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full articulation property suite
        run: pnpm test:slow
